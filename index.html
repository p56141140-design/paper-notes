<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>產業共生文獻庫｜Industrial Symbiosis × Agentic AI 論文筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <div class="intro">
    <div>
      <h1>論文筆記</h1>
      <p>每篇論文整理成固定欄位：研究問題、方法、資料來源、主要發現、限制，以及對我研究的啟發。</p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="依主題篩選"></div>
    <input class="search" id="search" type="search" placeholder="搜尋標題、作者、關鍵字" aria-label="搜尋論文">
  </div>
  <p class="result-count" id="result-count" aria-live="polite"></p>
  <div id="list"></div>
</main>
<footer id="site-footer"></footer>
<script src="data/papers.js"></script>
<script src="assets/app.js"></script>
<script>KB.renderIndex();</script>
</body>
</html>
